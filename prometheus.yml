global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ray-marketplace'

scrape_configs:
  # Backend metrics - all instances
  - job_name: 'backend'
    static_configs:
      - targets: ['backend1:4000', 'backend2:4000', 'backend3:4000']
    metrics_path: '/monitoring/metrics/prometheus'
    scrape_interval: 15s

  # Frontend metrics (if exposed)
  - job_name: 'frontend'
    static_configs:
      - targets: ['frontend1:80', 'frontend2:80']
    scrape_interval: 30s

  # Redis metrics (requires redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # PostgreSQL metrics (requires postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # PgBouncer metrics (requires pgbouncer_exporter)
  - job_name: 'pgbouncer'
    static_configs:
      - targets: ['pgbouncer-exporter:9127']
    scrape_interval: 30s

  # Elasticsearch metrics (requires elasticsearch_exporter)
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch-exporter:9114']
    scrape_interval: 30s

  # Jaeger metrics
  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']
    scrape_interval: 30s

  # Nginx metrics (requires nginx-prometheus-exporter)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 30s

  # Node exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            # - alertmanager:9093

rule_files:
  # - "alerts.yml"
