services:
  # Redis Cache with persistence
  redis:
    image: redis:7-alpine
    container_name: ray-redis-prod
    restart: on-failure:5
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database with optimized settings
  postgres:
    image: postgres:15-alpine
    container_name: ray-postgres-prod
    restart: on-failure:5
    environment:
      - POSTGRES_DB=ray_marketplace
      - POSTGRES_USER=ray_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--max-connections=200
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ray_user -d ray_marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch for search and logging
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ray-elasticsearch-prod
    restart: on-failure:5
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - cluster.name=ray-marketplace
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # PgBouncer Connection Pooling
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ray-pgbouncer-prod
    restart: on-failure:5
    environment:
      - DB_USER=ray_user
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=ray_marketplace
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=200
      - DEFAULT_POOL_SIZE=20
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
      - MAX_DB_CONNECTIONS=50
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ray_user"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Backend Application - Multiple instances for load balancing
  backend1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ray-backend-1
    restart: on-failure:5
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://ray_user:${POSTGRES_PASSWORD}@pgbouncer:5432/ray_marketplace?schema=public&connection_limit=10&pool_timeout=20&pgbouncer=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - JWT_SECRET=${JWT_SECRET}
      - BACKEND_PORT=4000
      - GLOBAL_RATE_LIMIT_MAX=10000
      - OTEL_ENABLED=true
      - JAEGER_ENDPOINT=http://jaeger:4318/v1/traces
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/monitoring/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ray-backend-2
    restart: on-failure:5
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://ray_user:${POSTGRES_PASSWORD}@pgbouncer:5432/ray_marketplace?schema=public&connection_limit=10&pool_timeout=20&pgbouncer=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - JWT_SECRET=${JWT_SECRET}
      - BACKEND_PORT=4000
      - GLOBAL_RATE_LIMIT_MAX=10000
      - OTEL_ENABLED=true
      - JAEGER_ENDPOINT=http://jaeger:4318/v1/traces
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/monitoring/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ray-backend-3
    restart: on-failure:5
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://ray_user:${POSTGRES_PASSWORD}@pgbouncer:5432/ray_marketplace?schema=public&connection_limit=10&pool_timeout=20&pgbouncer=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - JWT_SECRET=${JWT_SECRET}
      - BACKEND_PORT=4000
      - GLOBAL_RATE_LIMIT_MAX=10000
      - OTEL_ENABLED=true
      - JAEGER_ENDPOINT=http://jaeger:4318/v1/traces
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/monitoring/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Jaeger for Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: ray-jaeger-prod
    restart: on-failure:5
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # Frontend Application - Multiple instances
  frontend1:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ray-frontend-1
    restart: on-failure:5
    environment:
      - NODE_ENV=production
      - VITE_BACKEND_URL=http://backend1:4000
    depends_on:
      - backend1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend2:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ray-frontend-2
    restart: on-failure:5
    environment:
      - NODE_ENV=production
      - VITE_BACKEND_URL=http://backend2:4000
    depends_on:
      - backend2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy with Load Balancing
  nginx:
    image: nginx:alpine
    container_name: ray-nginx-prod
    restart: on-failure:5
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend1
      - backend2
      - backend3
      - frontend1
      - frontend2
      - jaeger

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: ray-prometheus
    restart: on-failure:5
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: ray-grafana
    restart: on-failure:5
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  elasticsearch_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  default:
    name: ray-network-prod
    driver: bridge
