[databases]
ray_marketplace = host=127.0.0.1 port=5433 dbname=ray_marketplace user=ray_user password=ray_password

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction

max_client_conn = 200
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 50

server_idle_timeout = 600
server_lifetime = 3600
client_idle_timeout = 0
client_login_timeout = 15

query_timeout = 30
query_wait_timeout = 30

ignore_startup_parameters = extra_float_digits,search_path

admin_users = ray_user
stats_users = ray_user

log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
