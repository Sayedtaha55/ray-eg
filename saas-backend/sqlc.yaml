version: "2"
sql:
  - schema: db/schema.sql
    queries: db/query.sql
    engine: postgresql
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_interface: true
        emit_exact_table_names: false
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: timestamptz
            go_type: time.Time
