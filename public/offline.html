<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>غير متصل بالإنترنت</title>
    <style>
      body { font-family: Alexandria, system-ui, sans-serif; margin: 0; background: #0f172a; color: #fff; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      section { max-width: 560px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 28px; padding: 32px; text-align: center; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0 0 20px; color: #cbd5e1; line-height: 1.8; }
      button { border: 0; border-radius: 999px; padding: 14px 24px; font-size: 16px; font-weight: 700; cursor: pointer; background: #00E5FF; color: #0f172a; }
      .cached-data { text-align: right; margin: 20px 0; max-height: 300px; overflow-y: auto; }
      .cached-item { background: rgba(255,255,255,0.04); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
      .cached-item h3 { margin: 0 0 8px; font-size: 16px; color: #00E5FF; }
      .cached-item p { margin: 0; font-size: 14px; color: #94a3b8; }
      .status-badge { display: inline-block; background: rgba(239,68,68,0.15); color: #f87171; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; margin-bottom: 16px; }
      .retry-banner { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.2); border-radius: 16px; padding: 12px; margin: 16px 0; font-size: 14px; color: #4ade80; display: none; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <span class="status-badge">غير متصل</span>
        <h1>الشبكة ضعيفة أو منقطعة</h1>
        <p>أنت غير متصل بالإنترنت حالياً. سيتم عرض آخر البيانات المحفوظة أدناه، وسيتم مزامنة أي تغييرات تلقائياً عند عودة الاتصال.</p>
        <div class="retry-banner" id="retryBanner">تمت مزامنة البيانات بنجاح! يتم إعادة التحميل...</div>
        <div class="cached-data" id="cachedData">
          <p style="text-align: center; color: #64748b;">جاري تحميل البيانات المحفوظة...</p>
        </div>
        <button onclick="window.location.reload()">إعادة المحاولة</button>
      </section>
    </main>
    <script>
      (async function() {
        var cachedDataEl = document.getElementById('cachedData');
        var items = [];

        // Try to get cached data from Cache Storage API
        try {
          var cacheNames = await caches.keys();
          for (var cn of cacheNames) {
            var cache = await caches.open(cn);
            var keys = await cache.keys();
            for (var key of keys) {
              if (key.url.indexOf('/api/') !== -1) {
                try {
                  var resp = await cache.match(key);
                  var json = await resp.json();
                  if (json && json.name) {
                    items.push({ title: json.name, subtitle: key.url });
                  } else if (json && Array.isArray(json) && json.length > 0 && json[0].name) {
                    json.slice(0, 3).forEach(function(j) {
                      items.push({ title: j.name || j.title || 'عنصر', subtitle: key.url });
                    });
                  }
                } catch (e) {}
              }
            }
          }
        } catch (e) {}

        // Try localStorage for last known shop/user data
        try {
          var lastShop = localStorage.getItem('ray_last_shop');
          if (lastShop) {
            var shop = JSON.parse(lastShop);
            items.unshift({ title: shop.name || shop.slug || 'المتجر', subtitle: 'آخر متجر تم زيارته' });
          }
        } catch (e) {}

        if (items.length > 0) {
          cachedDataEl.innerHTML = items.slice(0, 10).map(function(item) {
            return '<div class="cached-item"><h3>' + item.title + '</h3><p>' + item.subtitle + '</p></div>';
          }).join('');
        } else {
          cachedDataEl.innerHTML = '<p style="text-align: center; color: #64748b;">لا توجد بيانات محفوظة. سيتم تحميل البيانات عند عودة الاتصال.</p>';
        }

        // Listen for online event to auto-reload
        window.addEventListener('online', function() {
          var banner = document.getElementById('retryBanner');
          banner.style.display = 'block';
          setTimeout(function() { window.location.reload(); }, 1500);
        });
      })();
    </script>
  </body>
</html>
