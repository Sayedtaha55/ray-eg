version: "2"
sql:
  - schema: "sqlc/schema.sql"
    queries: "sqlc/queries"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "internal/generated/db"
        sql_package: "pgx/v5"
        emit_db_tags: true
        emit_pointers_for_null_types: false
        emit_enum_valid_method: true
        emit_all_enum_values: true
        json_tags_case_style: "camel"
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "uuid"
            go_type: "string"
          - db_type: "text"
            go_type: "string"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
