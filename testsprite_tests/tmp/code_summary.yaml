version: "2"
type: backend
tech_stack:
  - TypeScript
  - NestJS
  - React 19
  - Vite
  - Prisma ORM
  - PostgreSQL
  - Redis
  - TailwindCSS
  - BullMQ
  - Socket.io
  - AWS S3
  - Google Gemini AI
  - Electron
features:
  - name: Authentication
    description: User authentication with JWT, Google OAuth, password reset, email verification, and role-based access control
    files:
      - backend/src/modules/auth/auth.controller.ts
      - backend/src/modules/auth/auth.service.ts
      - backend/src/modules/auth/guards/jwt-auth.guard.ts
      - backend/src/modules/auth/guards/roles.guard.ts
    endpoints:
      - method: POST
        path: /api/v1/auth/signup
        description: Register a new user (customer or merchant)
        auth_required: false
        request_schema:
          body:
            email: string
            password: string
            name: string
            role: string
        response_schema:
          "201": object
          "400": Validation error
      - method: POST
        path: /api/v1/auth/login
        description: Login with email and password
        auth_required: false
        request_schema:
          body:
            email: string
            password: string
        response_schema:
          "200": object
          "401": Unauthorized
      - method: POST
        path: /api/v1/auth/courier-signup
        description: Register a new courier
        auth_required: false
        response_schema:
          "201": object
      - method: POST
        path: /api/v1/auth/bootstrap-admin
        description: Initialize admin account with bootstrap token
        auth_required: false
        request_schema:
          body:
            token: string
            email: string
            password: string
        response_schema:
          "201": object
      - method: GET
        path: /api/v1/auth/session
        description: Get current user session
        auth_required: false
        response_schema:
          "200": object
      - method: POST
        path: /api/v1/auth/logout
        description: Logout and clear session cookie
        auth_required: false
        response_schema:
          "200": object
      - method: POST
        path: /api/v1/auth/deactivate
        description: Deactivate user account
        auth_required: true
        response_schema:
          "200": object
      - method: POST
        path: /api/v1/auth/password/forgot
        description: Request password reset email
        auth_required: false
        response_schema:
          "200": object
      - method: POST
        path: /api/v1/auth/password/reset
        description: Reset password with token
        auth_required: false
        response_schema:
          "200": object
      - method: POST
        path: /api/v1/auth/password/change
        description: Change password for authenticated user
        auth_required: true
        response_schema:
          "200": object
      - method: POST
        path: /api/v1/auth/email/verify/request
        description: Request email verification
        auth_required: true
        response_schema:
          "200": object
      - method: POST
        path: /api/v1/auth/email/verify
        description: Verify email with token
        auth_required: false
        response_schema:
          "200": object
      - method: GET
        path: /api/v1/auth/google
        description: Start Google OAuth flow
        auth_required: false
        response_schema:
          "302": Redirect
      - method: GET
        path: /api/v1/auth/google/callback
        description: Google OAuth callback handler
        auth_required: false
        response_schema:
          "302": Redirect
      - method: POST
        path: /api/v1/auth/dev-merchant-login
        description: Dev-only quick merchant login
        auth_required: false
        response_schema:
          "200": object
      - method: POST
        path: /api/v1/auth/dev-courier-login
        description: Dev-only quick courier login
        auth_required: false
        response_schema:
          "200": object
    depends_on: []

  - name: Shop Management
    description: CRUD operations for shops, banner upload, design customization, analytics, admin approval workflow, module upgrade requests
    files:
      - backend/src/modules/shop/shop.controller.ts
      - backend/src/modules/shop/shop.service.ts
    endpoints:
      - method: POST
        path: /api/v1/shops
        description: Create a new shop
        auth_required: true
        response_schema:
          "201": object
      - method: GET
        path: /api/v1/shops/me
        description: Get current user shop
        auth_required: true
        response_schema:
          "200": object
      - method: PATCH
        path: /api/v1/shops/me
        description: Update current user shop settings
        auth_required: true
        response_schema:
          "200": object
      - method: POST
        path: /api/v1/shops/me/banner
        description: Upload shop banner image or video
        auth_required: true
        response_schema:
          "200": object
      - method: GET
        path: /api/v1/shops
        description: List all active shops with filters
        auth_required: false
        response_schema:
          "200": array
      - method: GET
        path: /api/v1/shops/:slug
        description: Get shop by slug or ID
        auth_required: false
        response_schema:
          "200": object
          "404": Not found
      - method: GET
        path: /api/v1/shops/id/:id
        description: Get shop by ID
        auth_required: false
        response_schema:
          "200": object
      - method: POST
        path: /api/v1/shops/:id/visit
        description: Track shop visit
        auth_required: false
        response_schema:
          "200": object
      - method: POST
        path: /api/v1/shops/:id/follow
        description: Follow a shop
        auth_required: true
        response_schema:
          "200": object
      - method: PATCH
        path: /api/v1/shops/:id/design
        description: Update shop page design config
        auth_required: true
        response_schema:
          "200": object
      - method: GET
        path: /api/v1/shops/:id/analytics
        description: Get shop analytics
        auth_required: true
        response_schema:
          "200": object
      - method: GET
        path: /api/v1/shops/admin/list
        description: Admin list shops by status
        auth_required: true
        response_schema:
          "200": array
      - method: PATCH
        path: /api/v1/shops/admin/:id/status
        description: Admin update shop status (approve/reject/suspend)
        auth_required: true
        response_schema:
          "200": object
      - method: GET
        path: /api/v1/shops/admin/:id
        description: Admin get shop by ID
        auth_required: true
        response_schema:
          "200": object
      - method: POST
        path: /api/v1/shops/me/module-upgrade-requests
        description: Request module upgrade for shop
        auth_required: true
        response_schema:
          "201": object
      - method: GET
        path: /api/v1/shops/me/module-upgrade-requests
        description: List module upgrade requests for shop
        auth_required: true
        response_schema:
          "200": array
      - method: GET
        path: /api/v1/shops/admin/module-upgrade-requests
        description: Admin list all module upgrade requests
        auth_required: true
        response_schema:
          "200": array
      - method: POST
        path: /api/v1/shops/admin/module-upgrade-requests/:id/approve
        description: Admin approve module upgrade request
        auth_required: true
        response_schema:
          "200": object
      - method: POST
        path: /api/v1/shops/admin/module-upgrade-requests/:id/reject
        description: Admin reject module upgrade request
        auth_required: true
        response_schema:
          "200": object
      - method: GET
        path: /api/v1/shops/sitemap
        description: Generate shop sitemap
        auth_required: false
        response_schema:
          "200": object
    depends_on:
      - Authentication

  - name: Product Management
    description: CRUD operations for products with images, variants, inventory tracking, 3D models, furniture metadata
    files:
      - backend/src/modules/product/product.controller.ts
      - backend/src/modules/product/product.service.ts
    endpoints:
      - method: GET
        path: /api/v1/products
        description: List products (by shopId or all active)
        auth_required: false
        response_schema:
          "200": array
      - method: GET
        path: /api/v1/products/:id
        description: Get product by ID
        auth_required: false
        response_schema:
          "200": object
      - method: GET
        path: /api/v1/products/manage/by-shop/:shopId
        description: List products for management (merchant/admin)
        auth_required: true
        response_schema:
          "200": array
      - method: POST
        path: /api/v1/products
        description: Create a new product
        auth_required: true
        request_schema:
          body:
            shopId: string
            name: string
            price: number
            stock: number
            category: string
            imageUrl: string
            description: string
        response_schema:
          "201": object
          "400": Validation error
      - method: PATCH
        path: /api/v1/products/:id
        description: Update product
        auth_required: true
        response_schema:
          "200": object
      - method: DELETE
        path: /api/v1/products/:id
        description: Delete product
        auth_required: true
        response_schema:
          "200": object
    depends_on:
      - Authentication
      - Shop Management

  - name: Order Management
